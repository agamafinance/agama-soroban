<text x="758" y="378" fill="#c2d6cb" font-size="10.5">authorized reporter set</text>
<text x="758" y="396" fill="#c2d6cb" font-size="10.5">push_nav(nav, timestamp)</text>
<text x="758" y="414" fill="#c2d6cb" font-size="10.5">per-feed staleness + deviation guards</text>
<text x="758" y="435" fill="#9fd9b8" font-size="10.5" font-weight="700">stale &#8594; OracleStale &#183; out of bounds &#8594; rejected</text>

