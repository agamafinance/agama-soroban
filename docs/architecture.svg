<text x="182" y="396" fill="#c2d6cb" font-size="10.5">request_withdrawal() &#183; claim_withdrawal()</text>
<text x="182" y="414" fill="#c2d6cb" font-size="10.5">get_nav() &#183; get_total_assets() &#183; set_paused()</text>
<text x="182" y="435" fill="#9fd9b8" font-size="10.5" font-weight="700">two-step FIFO queue, no priority</text>

<rect x="456" y="332" width="272" height="118" rx="12" fill="#37574a" stroke="#ffffff" stroke-width="1.5"/>
<text x="592" y="355" fill="#ffffff" font-size="13.5" font-weight="700" text-anchor="middle">Allocation Engine</text>
<text x="470" y="378" fill="#c2d6cb" font-size="10.5">register_pool() &#183; set_caps()</text>
<text x="470" y="396" fill="#c2d6cb" font-size="10.5">allocate() &#183; deallocate()</text>
<text x="470" y="414" fill="#c2d6cb" font-size="10.5">get_exposure() &#183; get_exposures()</text>
<text x="470" y="435" fill="#9fd9b8" font-size="10.5" font-weight="700">admin-directed in V1, constraint-enforcing</text>

<rect x="744" y="332" width="290" height="118" rx="12" fill="#37574a" stroke="#ffffff" stroke-width="1.5"/>
