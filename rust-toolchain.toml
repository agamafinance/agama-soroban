# Pinned to the compiler that produced what is on the ledger.
#
# Every deployed contract carries its build stamp in a contractmetav0 section,
# and every one of them says rustc 1.98.1. Read it yourself with
# `stellar contract fetch --id <address> --network testnet` and look for rsver.
# With this pin, `bash scripts/check-deployment-record.sh --wasm` rebuilds all
# seven live contracts byte for byte: 77 assertions, none failing.
#
# Changing this version means rebuilding and redeploying, not editing the number.
[toolchain]
channel = "1.98.1"
targets = ["wasm32v1-none"]
profile = "minimal"
