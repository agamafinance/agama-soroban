# Pinned to the compiler that produced what is on the ledger, not to the newest.
#
# Every deployed contract carries its build stamp in a contractmetav0 section,
# and every one of them says rustc 1.98.1. Read it yourself with
# `stellar contract fetch --id <address> --network testnet` and look for rsver.
# Pinning anything else would mean this tree could not even in principle rebuild
# what is deployed, which is the claim scripts/check-deployment-record.sh --wasm
# exists to test.
#
# This file was briefly pinned to 1.99.1 on the theory that an unpinned stable
# had drifted past the deployments. The ledger says that was wrong: the stamp is
# 1.98.1 and pinning 1.99.1 only moved the rebuild further away.
#
# Changing this version means rebuilding and redeploying, not editing the number.
[toolchain]
channel = "1.98.1"
targets = ["wasm32v1-none"]
profile = "minimal"
